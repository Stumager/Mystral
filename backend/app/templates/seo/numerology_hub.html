{% extends "seo/base.html" %}
{% block schema %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"{{ t.bc_home }}","item":"https://mystral.space"},{"@type":"ListItem","position":2,"name":"{{ t.bc_numerology }}","item":"{{ canonical }}"}]}</script>
{% endblock %}
{% block breadcrumbs %}<a href="/">{{ t.bc_home }}</a> › {{ t.bc_numerology }}{% endblock %}
{% block content %}
<h1>{{ t.numerology_hub_h1 }}</h1>
<p>{{ t.numerology_hub_intro }}</p>
<div class="links" style="margin-top:24px">{% for n in nums %}<a href="{{ prefix }}/numerology/{{ n.slug }}" style="text-align:center;padding:18px"><span style="display:block;font-family:'Cormorant Garamond',serif;font-size:32px;color:#C9A84C">{{ n.number }}</span><span style="font-size:13px;color:#B6AC98">{{ n.name }}</span></a>{% endfor %}</div>
{% endblock %}
