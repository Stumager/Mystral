server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # PageSpeed pass (2026-08-23): gzip was on but at nginx's default
    # gzip_comp_level 1 (barely better than uncompressed) since nothing here
    # ever set it, and image/svg+xml (favicon.svg, the app icons) wasn't in
    # gzip_types even though SVG is plain-text XML that compresses well.
    # Level 6 is the standard "good ratio, still cheap" middle ground — these
    # are pre-built static assets served from cache-friendly, content-hashed
    # filenames, not generated per-request, so the extra CPU cost is paid
    # once per file per worker, not once per visitor.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    # frame-ancestors instead of X-Frame-Options: Telegram Web runs the TMA in an iframe
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Prod incident (2026-08-21): a bare `proxy_pass http://backend:8000/;`
    # resolves the "backend" hostname ONCE via the OS resolver, when this
    # nginx worker starts, then caches that IP for the worker's lifetime.
    # After a host reboot / partial restart, Docker can recreate the
    # "backend" container with a new bridge-network IP — this container's
    # nginx keeps proxying to the old, dead IP forever (persistent 502 on
    # every /api/ call), and restarting "backend" alone does not fix it,
    # because this container was never told to re-resolve. Docker's
    # embedded DNS (127.0.0.11) plus a variable forces re-resolution on
    # every request, bounded by the TTL below, so a backend restart heals
    # itself here within seconds instead of requiring a manual restart of
    # this container too.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # The old static `proxy_pass http://backend:8000/;` stripped the
        # /api/ prefix automatically (nginx replaces the matched location
        # prefix with the URI part of a *static* proxy_pass target). A
        # variable-based proxy_pass loses that behavior entirely — nginx
        # forwards the original URI unchanged when a variable is involved
        # — so without this rewrite, "/api/health" would reach backend as
        # literally "/api/health" instead of "/health" and 404. Verified
        # live: this broke every /api/ call until the rewrite was added.
        #
        # `set` MUST come before `rewrite ... break;` — break halts the
        # rewrite-phase directive list for this location right there, so a
        # `set` written after it never runs ("using uninitialized variable",
        # also caught live).
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE streams: no buffering, allow long-lived connections
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # TZ-090: nothing here previously set Cache-Control, so every static
    # asset — including Vite's content-hashed JS/CSS — fell back to browser
    # heuristic caching (Lighthouse's "inefficient cache lifetimes" finding).
    # /assets/ filenames are content-hashed by the build, so a change always
    # ships under a new filename — a 1-year immutable cache is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker file itself must always be revalidated, or updates
    # never reach clients that already registered an old one.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Everything else static (favicon, manifest, tarot card art, icons) is
    # unhashed but rarely changes — a moderate cache still removes most of
    # the Lighthouse penalty without risking a long-lived stale asset.
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|woff2?|ico|json)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location / {
        # index.html references the hashed asset filenames, so it must
        # always be revalidated — never served stale out of a cache.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
