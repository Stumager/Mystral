events { worker_connections 1024; }
http {
  # Prod incident (2026-08-21): open-source nginx resolves the hostname in
  # an `upstream { server backend:8000; }` block ONCE, at startup/reload,
  # the same way it resolves a bare `proxy_pass http://backend;` — the IP
  # is then cached for as long as this nginx process runs. If the "backend"
  # or "frontend" container gets recreated later (host reboot, a partial
  # restart during maintenance) and Docker hands it a new bridge-network
  # IP, this nginx keeps sending traffic to the old, dead IP — a
  # persistent 502 that restarting only the recreated container does not
  # fix. Docker's embedded DNS (127.0.0.11) plus a variable in proxy_pass
  # forces re-resolution on every request instead, bounded by the TTL
  # below, so the stack heals itself within seconds of a container
  # restart rather than needing this nginx restarted too.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;
    location /api/ {
      set $frontend_upstream http://frontend:80;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
    }
    location ~ \.(jpg|jpeg|png|gif|webp|css|js|ico|woff2?)$ {
      set $frontend_upstream http://frontend:80;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
    }
    location ~ ^/((en|es|pt|tr|uk)/)?(zodiac|tarot|runes|numerology|natal-chart|lunar-calendar|compatibility|destiny-matrix|about|sitemap\.xml)(/.*)?$ {
      set $backend_upstream http://backend:8000;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
      set $frontend_upstream http://frontend:80;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
    }
  }
}
